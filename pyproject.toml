[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oeds-crawler-pack"
version = "0.0.0"
description = "KIT-derived crawler pack for Open Energy Data Server."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-or-later"
dependencies = []

[project.entry-points."oeds.crawlers"]
smard = "crawler.smard:SmardCrawler"
eurostat_crawler = "crawler.eurostat_crawler:EurostatCrawler"

[tool.setuptools.packages.find]
where = ["src"]
